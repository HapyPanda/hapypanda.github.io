<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="100 18 1100 690" role="img" aria-labelledby="title desc">
  <title id="title">Claude Memory flow</title>
  <desc id="desc">Memory context is prefilled before a user interaction. A save request is written according to memory rules. A search request uses memory_read for preferences or conversation_search for a past conversation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#323947"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; fill: #16181d; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .title { font-size: 27px; font-weight: 700; }
      .node-title { font-size: 22px; font-weight: 680; }
      .small { font-size: 16px; font-weight: 560; }
      .method { font-size: 18px; font-weight: 650; }
      .muted { fill: #667080; }
      .inverse { fill: #ffffff; }
      .edge { fill: none; stroke: #323947; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch-label { font-size: 15px; font-weight: 650; letter-spacing: .04em; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="26" fill="#ffffff"/>

  <!-- Prefill context -->
  <rect x="350" y="42" width="500" height="152" rx="18" fill="#f0f5ff" stroke="#1a56db" stroke-width="2.5"/>
  <text class="label node-title" x="600" y="86" text-anchor="middle">Memory prefill · context</text>

  <rect x="390" y="112" width="122" height="48" rx="24" fill="#ffffff" stroke="#a9bce8" stroke-width="1.5"/>
  <text class="label mono small" x="451" y="142" text-anchor="middle">profile.md</text>

  <rect x="526" y="112" width="164" height="48" rx="24" fill="#ffffff" stroke="#a9bce8" stroke-width="1.5"/>
  <text class="label mono small" x="608" y="142" text-anchor="middle">memory_listing</text>

  <rect x="704" y="112" width="106" height="48" rx="24" fill="#ffffff" stroke="#a9bce8" stroke-width="1.5"/>
  <text class="label small" x="757" y="142" text-anchor="middle">context 规则</text>

  <!-- Interaction -->
  <path class="edge" d="M600 194 V238"/>
  <rect x="470" y="242" width="260" height="76" rx="16" fill="#16181d"/>
  <circle cx="510" cy="280" r="11" fill="#8ab4ff"/>
  <text class="label node-title inverse" x="610" y="287" text-anchor="middle">用户交互</text>

  <!-- Main split -->
  <path class="edge" d="M545 318 V360 H274 V398"/>
  <path class="edge" d="M655 318 V360 H826 V398"/>
  <rect x="241" y="345" width="66" height="30" rx="15" fill="#fff1ef"/>
  <text class="label branch-label" x="274" y="365" text-anchor="middle" fill="#b9332e">SAVE</text>
  <rect x="783" y="345" width="86" height="30" rx="15" fill="#eef3ff"/>
  <text class="label branch-label" x="826" y="365" text-anchor="middle" fill="#174cad">SEARCH</text>

  <!-- Save branch -->
  <rect x="132" y="402" width="284" height="86" rx="16" fill="#fff7f5" stroke="#e86a61" stroke-width="2.5"/>
  <text class="label node-title" x="274" y="438" text-anchor="middle">Save</text>
  <text class="label small muted" x="274" y="466" text-anchor="middle">持久事实 / 用户决定</text>

  <path class="edge" d="M274 488 V564"/>
  <rect x="132" y="568" width="284" height="116" rx="16" fill="#ffffff" stroke="#323947" stroke-width="2"/>
  <text class="label node-title" x="274" y="606" text-anchor="middle">按规则写入</text>
  <text class="label small muted" x="274" y="646" text-anchor="middle">分类 · 隐私 · 版本控制</text>

  <!-- Search branch -->
  <rect x="684" y="402" width="284" height="86" rx="16" fill="#f7f9ff" stroke="#4c75dc" stroke-width="2.5"/>
  <text class="label node-title" x="826" y="438" text-anchor="middle">搜索</text>
  <text class="label small muted" x="826" y="466" text-anchor="middle">模型判断信息来源</text>

  <path class="edge" d="M826 488 V526 H628 V564"/>
  <path class="edge" d="M826 488 V526 H1024 V564"/>

  <rect x="476" y="568" width="304" height="116" rx="16" fill="#f5f0ff" stroke="#7b61c8" stroke-width="2.5"/>
  <text class="label small muted" x="628" y="604" text-anchor="middle">简单偏好</text>
  <text class="label mono method" x="628" y="646" text-anchor="middle">memory_read</text>

  <rect x="872" y="568" width="304" height="116" rx="16" fill="#eef5ff" stroke="#1a56db" stroke-width="2.5"/>
  <text class="label small muted" x="1024" y="604" text-anchor="middle">历史会话</text>
  <text class="label mono method" x="1024" y="646" text-anchor="middle">conversation_search</text>

</svg>
