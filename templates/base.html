<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ pageTitle }}</title><meta name="description" content="{{ metaDescription }}">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="canonical" href="{{ canonicalAbs }}">
<meta property="og:title" content="{{ pageTitle }}"><meta property="og:description" content="{{ metaDescription }}"><meta property="og:url" content="{{ canonicalAbs }}"><meta property="og:type" content="{{ ogType }}"><meta property="og:site_name" content="{{ site.title }}"><meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/rss.xml">
<script src="/js/theme.js?v={{ assetVersion }}"></script>
<link rel="stylesheet" href="/css/style.css?v={{ assetVersion }}">
<script defer src="/js/main.js?v={{ assetVersion }}"></script>
</head>
<body id="top">
<a class="skip-link" href="#main">跳到正文</a>
<main id="main">{{{ body }}}</main>
<footer class="footer wide"><a class="brand" href="/">HappyPanda.</a><p>张启元 · Qiyuan Zhang</p><a href="#top" class="back-top">回到顶部{{{ icons.arrowUpRight }}}</a><img src="/img/panda.png" alt="正在休息的熊猫" width="44" height="44"></footer>
<dialog class="modal reader" aria-label="阅读文章"><div class="modal-sheet"><button class="icon-button modal-close" data-close-modal aria-label="关闭">{{{ icons.close }}}</button><div data-reader-content></div></div></dialog>
</body></html>
